<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Successful</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <style>
        .reveal { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        .success-circle {
            animation: scaleIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes scaleIn { from { transform: scale(0); } to { transform: scale(1); } }
    </style>
</head>
<body class="bg-[#141313] text-[#e5e2e1] pt-28 pb-24 min-h-screen flex items-center justify-center">

    <!-- Global Navbar -->
    <nav class="w-full bg-[#141313]/80 backdrop-blur-md border-b border-white/5 fixed top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <a href="/" class="text-2xl font-bold text-white tracking-tighter">NEXUS</a>
            <div class="hidden md:flex gap-8 items-center">
                <a href="/" class="text-sm font-medium text-zinc-400 hover:text-white transition-colors">Home</a>
                <a href="/products.html" class="text-sm font-medium text-zinc-400 hover:text-white transition-colors">Products</a>
                <a href="/contact.html" class="text-sm font-medium text-zinc-400 hover:text-white transition-colors">Contact</a>
            </div>
            <a href="/cart.html" class="flex items-center gap-2 bg-[#c0c1ff]/10 hover:bg-[#c0c1ff]/20 text-[#c0c1ff] px-4 py-2 rounded-full transition-colors relative">
                <span class="material-symbols-outlined text-sm">shopping_cart</span>
                <span class="cart-count absolute -top-1 -right-1 bg-[#c0c1ff] text-black text-[10px] font-bold w-4 h-4 flex items-center justify-center rounded-full" style="display:none">0</span>
            </a>
        </div>
    </nav>

    <main class="w-full max-w-md mx-auto px-6 text-center reveal">
        <div class="w-24 h-24 bg-green-500/20 text-green-500 rounded-full flex items-center justify-center mx-auto mb-8 success-circle">
            <span class="material-symbols-outlined text-5xl">check_circle</span>
        </div>
        
        <h1 class="text-3xl font-bold text-white mb-4">Order Placed Successfully!</h1>
        <p class="text-zinc-400 mb-8">Thank you for your purchase. We are preparing your custom NFC card.</p>
        
        <div class="bg-[#1c1b1b] rounded-2xl p-6 border border-white/5 mb-8">
            <p class="text-sm text-zinc-500 uppercase tracking-wider font-bold mb-1">Order ID</p>
            <p id="order-id" class="text-2xl font-bold text-[#c0c1ff] tracking-widest">...</p>
        </div>
        
        <a href="/" class="w-full py-4 bg-[#3131c0] hover:brightness-110 text-white rounded-xl font-bold text-lg text-center transition-all inline-block">
            Return to Home
        </a>
    </main>

    <script src="/app-store.js"></script>
</body>
</html>
