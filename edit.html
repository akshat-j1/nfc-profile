<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit NFC Profile</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
</head>
<body>

    <!-- Global Navbar -->
    <nav class="w-full bg-[#141313]/80 backdrop-blur-md border-b border-white/5 fixed top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <a href="/" class="text-2xl font-bold text-white tracking-tighter">NEXUS</a>
            <div class="hidden md:flex gap-8 items-center">
                <a href="/" class="text-sm font-medium text-zinc-400 hover:text-white transition-colors">Home</a>
                <a href="/products.html" class="text-sm font-medium text-zinc-400 hover:text-white transition-colors">Products</a>
                <a href="/contact.html" class="text-sm font-medium text-zinc-400 hover:text-white transition-colors">Contact</a>
            </div>
            <a href="/cart.html" class="flex items-center gap-2 bg-[#c0c1ff]/10 hover:bg-[#c0c1ff]/20 text-[#c0c1ff] px-4 py-2 rounded-full transition-colors relative">
                <span class="material-symbols-outlined text-sm">shopping_cart</span>
                <span class="cart-count absolute -top-1 -right-1 bg-[#c0c1ff] text-black text-[10px] font-bold w-4 h-4 flex items-center justify-center rounded-full" style="display:none">0</span>
            </a>
        </div>
    </nav>
    <div style="height: 80px;"></div> <!-- Spacer for fixed navbar -->
    <main class="card-container" style="display: flex;">
        <div class="edit-header">
            <h1 class="profile-name">Edit Profile</h1>
            <p class="profile-title">Editing user: <strong id="edit-userId">...</strong></p>
        </div>

        <div id="auth-box" style="width: 100%; text-align: center; margin-bottom: 24px;">
            <h3 style="font-size: 18px; font-weight: 600; margin-bottom: 16px;">Enter Password</h3>
            <input type="password" id="passwordInput" class="form-control" placeholder="Enter password" style="text-align: center; margin-bottom: 12px;" />
            <p id="password-hint" class="demo-hint" style="font-size: 13px; color: #666; margin-bottom: 24px;"></p>
            <button id="unlockBtn" class="btn btn-primary" style="width: 100%;">Unlock</button>
            <p id="authError" style="color:#ef4444; font-weight: 500; font-size: 14px; display:none; margin-top: 16px; text-align: center;">Incorrect password</p>
        </div>

        <form id="edit-form" style="width: 100%; display: none;">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" class="form-control" required placeholder="e.g. Rahul Sharma">
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" class="form-control" required placeholder="e.g. 9876543210">
            </div>

            <div class="form-group">
                <label for="linkedin">LinkedIn URL</label>
                <input type="url" id="linkedin" class="form-control" placeholder="https://linkedin.com/in/username">
            </div>

            <div class="form-group">
                <label for="mainAction">On Tap Action</label>
                <select id="mainAction" class="form-control" required>
                    <option value="profile">Show Profile Page</option>
                    <option value="linkedin">Open LinkedIn Directly</option>
                    <option value="phone">Open Phone Dialer</option>
                </select>
            </div>

            <div class="action-buttons" style="margin-top: 24px;">
                <button type="submit" class="btn btn-primary">
                    💾 Save Changes
                </button>
                <button type="button" class="btn btn-secondary" onclick="window.history.back()">
                    Cancel
                </button>
            </div>
        </form>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <script src="/script.js"></script>
    <script src="/app-store.js"></script>
    <script>
        // Initialize the edit page on load
        document.addEventListener('DOMContentLoaded', () => {
            initEditPage();
        });
    </script>
</body>
</html>
