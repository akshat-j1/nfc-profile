<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit NFC Profile</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
</head>
<body>

    <main class="card-container" style="display: flex;">
        <div class="edit-header">
            <h1 class="profile-name">Edit Profile</h1>
            <p class="profile-title">Editing user: <strong id="edit-userId">...</strong></p>
        </div>

        <div id="auth-box" style="width: 100%; text-align: left; margin-bottom: 24px;">
            <h3 style="font-size: 16px; margin-bottom: 8px;">Enter Password</h3>
            <input type="password" id="passwordInput" class="form-control" placeholder="Enter password" style="margin-bottom: 12px;" />
            <p class="demo-hint" style="font-size: 13px; color: #666; margin-top: 8px; margin-bottom: 16px;">Demo password: <strong>1234</strong></p>
            <button id="unlockBtn" class="btn btn-primary">Unlock</button>
            <p id="authError" style="color:#ef4444; font-weight: 500; font-size: 14px; display:none; margin-top: 12px; text-align: center;">Incorrect password</p>
        </div>

        <form id="edit-form" style="width: 100%; display: none;">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" class="form-control" required placeholder="e.g. Rahul Sharma">
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" class="form-control" required placeholder="e.g. 9876543210">
            </div>

            <div class="form-group">
                <label for="linkedin">LinkedIn URL</label>
                <input type="url" id="linkedin" class="form-control" placeholder="https://linkedin.com/in/username">
            </div>

            <div class="form-group">
                <label for="mainAction">On Tap Action</label>
                <select id="mainAction" class="form-control" required>
                    <option value="profile">Show Profile Page</option>
                    <option value="linkedin">Open LinkedIn Directly</option>
                    <option value="phone">Open Phone Dialer</option>
                </select>
            </div>

            <div class="action-buttons" style="margin-top: 24px;">
                <button type="submit" class="btn btn-primary">
                    💾 Save Changes
                </button>
                <button type="button" class="btn btn-secondary" onclick="window.history.back()">
                    Cancel
                </button>
            </div>
        </form>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <script src="/script.js"></script>
    <script>
        // Initialize the edit page on load
        document.addEventListener('DOMContentLoaded', () => {
            initEditPage();
        });
    </script>
</body>
</html>
