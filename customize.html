<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customize Your NFC Card</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <style>
        .tilt-card { transition: transform 0.1s ease-out, box-shadow 0.3s ease; }
        .reveal { animation: fadeIn 0.3s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Custom Layout Classes */
        .customize-container {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 60px;
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px;
        }
        .customize-left {
            width: 320px;
            flex-shrink: 0;
        }
        .customize-right {
            width: 100%;
            max-width: 420px;
        }
        .customize-btn {
            white-space: nowrap;
            width: 100%;
            padding: 14px 20px;
            transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
        }
        .customize-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(49, 49, 192, 0.3);
        }
        .customize-btn:active {
            transform: scale(0.98);
        }
        .live-update {
            animation: textUpdate 0.15s ease-out;
        }
        @keyframes textUpdate {
            0% { opacity: 0.5; transform: scale(0.98); }
            100% { opacity: 1; transform: scale(1); }
        }
        @media (max-width: 768px) {
            .customize-container {
                flex-direction: column;
                align-items: center;
            }
            .customize-left {
                width: 100%;
                max-width: 320px;
            }
        }
    </style>
</head>
<body class="bg-[#141313] text-[#e5e2e1] pt-28 pb-24 min-h-screen">

    <!-- Global Navbar -->
    <nav class="w-full bg-[#141313]/80 backdrop-blur-md border-b border-white/5 fixed top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <a href="/" class="text-2xl font-bold text-white tracking-tighter">NEXUS</a>
            <div class="hidden md:flex gap-8 items-center">
                <a href="/" class="text-sm font-medium text-zinc-400 hover:text-white transition-colors">Home</a>
                <a href="/products.html" class="text-sm font-medium text-zinc-400 hover:text-white transition-colors">Products</a>
                <a href="/contact.html" class="text-sm font-medium text-zinc-400 hover:text-white transition-colors">Contact</a>
            </div>
            <a href="/cart.html" class="flex items-center gap-2 bg-[#c0c1ff]/10 hover:bg-[#c0c1ff]/20 text-[#c0c1ff] px-4 py-2 rounded-full transition-colors relative">
                <span class="material-symbols-outlined text-sm">shopping_cart</span>
                <span class="cart-count absolute -top-1 -right-1 bg-[#c0c1ff] text-black text-[10px] font-bold w-4 h-4 flex items-center justify-center rounded-full" style="display:none">0</span>
            </a>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-6">
        
        <!-- Breadcrumb & Back Nav -->
        <div class="mb-4 reveal">
            <a href="/products.html" class="inline-flex items-center text-zinc-400 hover:text-white transition-colors mb-4 font-medium text-sm">
                <span class="material-symbols-outlined text-sm mr-1">arrow_back</span>
                Back to Products
            </a>
            <div class="flex items-center gap-3 text-sm font-medium">
                <span class="text-zinc-500">Step 1: Choose Product</span>
                <span class="material-symbols-outlined text-zinc-600 text-sm">chevron_right</span>
                <span class="text-[#c0c1ff]">Step 2: Customize</span>
            </div>
        </div>

        <div class="customize-container reveal">
            <!-- LEFT SIDE: Live Preview -->
            <div class="customize-left sticky top-32">
                <div class="mb-6">
                    <h2 class="text-3xl font-bold text-white mb-2" id="product-name">Loading...</h2>
                    <p class="text-xl text-zinc-400">Base Price: <span id="product-price" class="text-[#c0c1ff] font-bold">₹0</span></p>
                </div>
                
                <h3 class="text-xl font-bold text-white mb-4">Live Preview</h3>
                <div class="perspective-1000 w-full">
                    <div id="preview-card" class="w-full aspect-[1.58/1] bg-zinc-900 rounded-2xl p-6 flex flex-col justify-between shadow-2xl transition-all duration-300 tilt-card text-white border border-white/10 hover:shadow-[0_20px_50px_rgba(0,0,0,0.5)]">
                        <div class="flex justify-between items-start">
                            <div class="text-2xl font-bold tracking-tighter">NEXUS</div>
                            <span class="material-symbols-outlined opacity-50">nfc</span>
                        </div>
                        <div>
                            <div id="preview-name" class="text-xl font-medium mb-1">Your Name</div>
                            <div class="opacity-70 text-[10px] font-bold uppercase tracking-wider">Tap to Connect</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- RIGHT SIDE: Customization Form -->
            <div class="customize-right bg-[#1c1b1b] p-10 rounded-3xl border border-white/5 shadow-2xl" style="animation-delay: 0.1s;">
                <h2 class="text-2xl font-bold text-white mb-10 tracking-tight">Customize Details</h2>
                
                <div class="space-y-8">
                    <div>
                        <label class="block text-sm font-medium text-zinc-400 mb-2">Full Name (Printed on Card)</label>
                        <input type="text" id="input-name" class="w-full bg-zinc-900 border border-white/10 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-[#c0c1ff] focus:ring-2 focus:ring-[#c0c1ff]/20 transition-all duration-200 leading-relaxed" placeholder="e.g. Alex Rivers">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-zinc-400 mb-2">Phone Number</label>
                        <input type="tel" id="input-phone" class="w-full bg-zinc-900 border border-white/10 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-[#c0c1ff] focus:ring-2 focus:ring-[#c0c1ff]/20 transition-all duration-200 leading-relaxed" placeholder="e.g. 9876543210">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-zinc-400 mb-2">LinkedIn URL (Optional)</label>
                        <input type="url" id="input-linkedin" class="w-full bg-zinc-900 border border-white/10 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-[#c0c1ff] focus:ring-2 focus:ring-[#c0c1ff]/20 transition-all duration-200 leading-relaxed" placeholder="https://linkedin.com/in/username">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-zinc-400 mb-2">Card Theme</label>
                        <select id="input-theme" class="w-full bg-zinc-900 border border-white/10 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-[#c0c1ff] focus:ring-2 focus:ring-[#c0c1ff]/20 transition-all duration-200 appearance-none leading-relaxed">
                            <option value="dark">Matte Dark</option>
                            <option value="light">Creator Light</option>
                            <option value="gradient">Holographic Tech</option>
                            <option value="glass">Frosted Glass</option>
                        </select>
                    </div>

                    <div class="pt-6 border-t border-white/5">
                        <button id="add-to-cart-btn" class="customize-btn bg-[#3131c0] hover:brightness-110 text-white rounded-xl font-bold text-lg text-center transition-all shadow-xl shadow-[#3131c0]/20 flex items-center justify-center gap-2">
                            <span class="material-symbols-outlined">add_shopping_cart</span>
                            Add to Cart
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="/app-store.js"></script>
</body>
</html>
