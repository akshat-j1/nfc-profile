<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <style>
        .reveal { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-[#141313] text-[#e5e2e1] pt-28 pb-24 min-h-screen">

    <!-- Global Navbar -->
    <nav class="w-full bg-[#141313]/80 backdrop-blur-md border-b border-white/5 fixed top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <a href="/" class="text-2xl font-bold text-white tracking-tighter">NEXUS</a>
            <div class="hidden md:flex gap-8 items-center">
                <a href="/" class="text-sm font-medium text-zinc-400 hover:text-white transition-colors">Home</a>
                <a href="/products.html" class="text-sm font-medium text-zinc-400 hover:text-white transition-colors">Products</a>
                <a href="/contact.html" class="text-sm font-medium text-zinc-400 hover:text-white transition-colors">Contact</a>
            </div>
            <a href="/cart.html" class="flex items-center gap-2 bg-[#c0c1ff]/10 hover:bg-[#c0c1ff]/20 text-[#c0c1ff] px-4 py-2 rounded-full transition-colors relative">
                <span class="material-symbols-outlined text-sm">shopping_cart</span>
                <span class="cart-count absolute -top-1 -right-1 bg-[#c0c1ff] text-black text-[10px] font-bold w-4 h-4 flex items-center justify-center rounded-full" style="display:none">0</span>
            </a>
        </div>
    </nav>

    <main class="max-w-2xl mx-auto px-6 reveal">
        <h1 class="text-3xl font-bold text-white mb-8 text-center">Secure Checkout</h1>
        
        <div class="bg-[#1c1b1b] rounded-3xl p-6 md:p-8 border border-white/5 shadow-2xl">
            <div class="mb-8">
                <h3 class="text-xl font-bold text-white mb-4">Shipping Information</h3>
                <div class="space-y-4">
                    <input type="text" class="w-full bg-zinc-900 border border-white/10 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-[#c0c1ff] transition-colors" placeholder="Full Name" value="Demo Customer">
                    <input type="text" class="w-full bg-zinc-900 border border-white/10 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-[#c0c1ff] transition-colors" placeholder="Delivery Address" value="123 Tech Park, Bengaluru">
                </div>
            </div>

            <div class="mb-8">
                <h3 class="text-xl font-bold text-white mb-4">Payment Method (Simulated)</h3>
                <div class="p-4 bg-zinc-900 border border-[#c0c1ff] rounded-xl flex items-center gap-3">
                    <span class="material-symbols-outlined text-[#c0c1ff]">credit_card</span>
                    <span class="text-white font-medium">Pay on Delivery / Demo Card</span>
                </div>
            </div>
            
            <div class="border-t border-white/5 mt-6 pt-6 flex justify-between items-center mb-8">
                <h3 class="text-xl text-zinc-400">Order Total</h3>
                <span id="checkout-total" class="text-3xl font-bold text-[#c0c1ff]">₹0</span>
            </div>
            
            <button id="place-order-btn" class="w-full py-4 bg-[#3131c0] hover:brightness-110 text-white rounded-xl font-bold text-lg text-center transition-all shadow-xl shadow-[#3131c0]/20 flex items-center justify-center gap-2">
                <span class="material-symbols-outlined">lock</span>
                Place Order
            </button>
        </div>
    </main>

    <script src="/app-store.js"></script>
</body>
</html>
