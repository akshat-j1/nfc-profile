<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <style>
        .reveal { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-[#141313] text-[#e5e2e1] pt-28 pb-24 min-h-screen">

    <!-- Global Navbar -->
    <nav class="w-full bg-[#141313]/80 backdrop-blur-md border-b border-white/5 fixed top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <a href="/" class="text-2xl font-bold text-white tracking-tighter">NEXUS</a>
            <div class="hidden md:flex gap-8 items-center">
                <a href="/" class="text-sm font-medium text-zinc-400 hover:text-white transition-colors">Home</a>
                <a href="/products.html" class="text-sm font-medium text-zinc-400 hover:text-white transition-colors">Products</a>
                <a href="/contact.html" class="text-sm font-medium text-white hover:text-white transition-colors">Contact</a>
            </div>
            <a href="/cart.html" class="flex items-center gap-2 bg-[#c0c1ff]/10 hover:bg-[#c0c1ff]/20 text-[#c0c1ff] px-4 py-2 rounded-full transition-colors relative">
                <span class="material-symbols-outlined text-sm">shopping_cart</span>
                <span class="cart-count absolute -top-1 -right-1 bg-[#c0c1ff] text-black text-[10px] font-bold w-4 h-4 flex items-center justify-center rounded-full" style="display:none">0</span>
            </a>
        </div>
    </nav>

    <main class="max-w-3xl mx-auto px-6 reveal">
        <div class="text-center mb-12">
            <h1 class="text-4xl font-bold text-white mb-4">Get in Touch</h1>
            <p class="text-zinc-400 max-w-lg mx-auto">Have questions about bulk orders or custom enterprise solutions? We'd love to hear from you.</p>
        </div>

        <div class="grid md:grid-cols-2 gap-8">
            <div class="bg-[#1c1b1b] rounded-3xl p-8 border border-white/5 shadow-2xl h-full">
                <h3 class="text-xl font-bold text-white mb-6">Send us a message</h3>
                <form class="space-y-4" onsubmit="event.preventDefault(); alert('Message sent successfully!'); this.reset();">
                    <input type="text" class="w-full bg-zinc-900 border border-white/10 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-[#c0c1ff] transition-colors" placeholder="Your Name" required>
                    <input type="email" class="w-full bg-zinc-900 border border-white/10 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-[#c0c1ff] transition-colors" placeholder="Your Email" required>
                    <textarea class="w-full bg-zinc-900 border border-white/10 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-[#c0c1ff] transition-colors h-32 resize-none" placeholder="How can we help you?" required></textarea>
                    <button type="submit" class="w-full py-4 bg-[#3131c0] hover:brightness-110 text-white rounded-xl font-bold text-lg text-center transition-all shadow-xl shadow-[#3131c0]/20">
                        Send Message
                    </button>
                </form>
            </div>

            <div class="flex flex-col gap-6">
                <div class="bg-[#1c1b1b] rounded-3xl p-8 border border-white/5 flex-1 flex flex-col justify-center">
                    <div class="w-12 h-12 bg-[#25d366]/20 text-[#25d366] rounded-full flex items-center justify-center mb-4">
                        <span class="material-symbols-outlined">forum</span>
                    </div>
                    <h3 class="text-xl font-bold text-white mb-2">WhatsApp Support</h3>
                    <p class="text-zinc-400 mb-6">Instant support for urgent queries.</p>
                    <a href="#" onclick="alert('WhatsApp Redirect simulated')" class="w-full py-3 bg-[#25d366]/10 text-[#25d366] hover:bg-[#25d366]/20 border border-[#25d366]/30 rounded-xl font-bold text-center transition-all">
                        Chat on WhatsApp
                    </a>
                </div>

                <div class="bg-[#1c1b1b] rounded-3xl p-8 border border-white/5 flex-1 flex flex-col justify-center">
                    <div class="w-12 h-12 bg-[#c0c1ff]/20 text-[#c0c1ff] rounded-full flex items-center justify-center mb-4">
                        <span class="material-symbols-outlined">mail</span>
                    </div>
                    <h3 class="text-xl font-bold text-white mb-2">Email Us</h3>
                    <p class="text-zinc-400 mb-6">hello@nexusnfc.com</p>
                    <a href="mailto:hello@nexusnfc.com" class="w-full py-3 bg-[#c0c1ff]/10 text-[#c0c1ff] hover:bg-[#c0c1ff]/20 border border-[#c0c1ff]/30 rounded-xl font-bold text-center transition-all">
                        Send Email
                    </a>
                </div>
            </div>
        </div>
    </main>

    <script src="/app-store.js"></script>
</body>
</html>
